<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WakeLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        * {
            margin: 1px;
        }

        .hero {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            background-image: linear-gradient(to left, rgba(168, 160, 160, 0.8),
                    rgba(0, 0, 0, 0.8)), url("assets/activities.jpg");
            color: wheat;
            min-height: 400px;
        }

        .hero a {
            color: black;
            text-decoration: none;
            padding: 20px;
            border-radius: 5px;
            background-color: aqua;
        }

        .cards {
            gap: 5px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .buttons {
            display: flex;
            gap: 4px;
        }

        .buttonDelete {
            background-color: red;
            border-radius: 5px;
            border-style: none;
            color: wheat;
        }

        .buttonModifyP {
            background-color: green;
            border-radius: 5px;
            border-style: none;
            color: wheat;
        }

        .buttonModifyE {
            background-color: blue;
            border-radius: 5px;
            border-style: none;
            color: wheat;
        }

        .cardsContain {
            display: flex;
            justify-content: center;
            padding: 5px;
        }
        .card-body{
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavAltMarkup"
                aria-labelledby="navbarNavAltMarkupLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body" style="display: flex;justify-content: center;">
                    <div class="nav nav-pills navbar-nav">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                        <a class="nav-link" href="#cards">Activities</a>
                        <a class="nav-link" href="#">Create an activity</a>
                    </div>
                </div>
            </dialog>
        </div>
    </nav>
    <section class="hero">
        <h1>CLASS SHOULD NEVER BE BORING</h1>
        <h3>Create and share activities with your classmates to make each class more engaging!!</h3>
        <div>
            <a href=""> <i class="fa-solid fa-plus"></i> create an activity </a>
        </div>
    </section>
    <div class="cardsContain">
        <section class="cards" id="cards">
        
        </section>
    </div>
    <script type="module" src="app.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
